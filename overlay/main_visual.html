<!-- overlay/main_visual.html v11 — Living Portrait -->
<!-- 1枚の画像のパーツごとに個別アニメーション -->
<!-- 瞬き・口パク・呼吸・髪揺れを滑らかに -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#0a0a14}
canvas#cv{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}
video#vid{position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;z-index:3;opacity:0;transition:opacity 0.8s}
video#vid.show{opacity:1}
#vig{position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,
    transparent 40%,rgba(0,0,0,0.15) 65%,rgba(0,0,0,0.45) 100%)}
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<video id="vid" muted playsinline preload="auto"></video>
<div id="vig"></div>

<script>
const WS = 'ws://127.0.0.1:8765';
const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const vid = document.getElementById('vid');
let ws = null, t = 0, lastTime = performance.now(), dt = 0;
let homeImg = null, isVideo = false, reverseRAF = null;
let speaking = false, speakTimer = null;

// ===== 瞬きの状態 =====
let blinkTimer = 0;        // 次の瞬きまでのカウントダウン
let blinkPhase = 0;        // 0=開, 0→1→0で閉→開
let blinkSpeed = 8;        // 瞬きの速さ
let nextBlink = 3 + Math.random() * 4;  // 3-7秒間隔

// ===== Living Portraitの描画 =====
function render() {
  const now = performance.now();
  dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  t += dt;
  if (isVideo || !homeImg || !homeImg.complete) {
    requestAnimationFrame(render);
    return;
  }

  const iw = homeImg.naturalWidth;
  const ih = homeImg.naturalHeight;
  // カバーモード計算
  const scale = Math.max(W / iw, H / ih);
  const dw = iw * scale;
  const dh = ih * scale;
  const ox = (W - dw) / 2;
  const oy = (H - dh) / 2;

  // --- 呼吸 ---
  const breathCycle = Math.sin(t * 0.9);
  const breathScale = 1.0 + breathCycle * 0.002;
  // --- 微動(手持ちカメラ風) ---
  const swayX = Math.sin(t * 0.2) * 1.2;
  const swayY = Math.cos(t * 0.17) * 0.8;

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2 + swayX, H/2 + swayY);
  ctx.scale(breathScale, breathScale);
  ctx.translate(-W/2, -H/2);

  // ===== ストリップ描画（パーツごとのアニメーション） =====
  // 画像を30段の水平ストリップで描画し、各ストリップに個別変位を適用
  const STRIPS = 30;
  const stripH = ih / STRIPS;
  const dstStripH = dh / STRIPS;

  for (let i = 0; i < STRIPS; i++) {
    const ny = i / STRIPS;  // 0(上)〜1(下) 正規化Y位置
    let dx = 0, dy = 0, sy = 1.0;  // X変位, Y変位, Y伸縮

    // --- 髪揺れ (上部20%: ny < 0.2) ---
    if (ny < 0.2) {
      const hairFactor = (0.2 - ny) / 0.2;  // 上ほど強く
      dx = Math.sin(t * 0.7 + ny * 5) * hairFactor * 3;
    }

    // --- 呼吸による体の上下 (下部50%: ny > 0.5) ---
    if (ny > 0.5) {
      const bodyFactor = (ny - 0.5) / 0.5;  // 下ほど強く
      dy = breathCycle * bodyFactor * 2;
    }

    // --- 発話中の微揺れ (中央30-50%) ---
    if (speaking && ny > 0.3 && ny < 0.5) {
      const talkFactor = 1 - Math.abs(ny - 0.4) / 0.1;
      dy += Math.sin(t * 6) * talkFactor * 1.5;
    }

    // ストリップを描画
    ctx.drawImage(homeImg,
      0, i * stripH, iw, stripH + 1,  // source
      ox + dx, oy + i * dstStripH + dy, dw, dstStripH + 1  // dest
    );
  }

  // ===== 瞬き (目の領域にまぶたオーバーレイ) =====
  blinkTimer += dt;
  if (blinkTimer >= nextBlink && blinkPhase === 0) {
    blinkPhase = 0.01;  // 瞬き開始
    blinkTimer = 0;
    nextBlink = 2.5 + Math.random() * 5;  // 次は2.5-7.5秒後
    // 時々二重瞬き
    if (Math.random() < 0.2) nextBlink = 0.3;
  }

  if (blinkPhase > 0) {
    blinkPhase += blinkSpeed * dt;
    if (blinkPhase >= 1) blinkPhase = 0;  // 瞬き完了

    // 閉じ→開き の曲線 (0→1→0、ピークは0.4付近で速く閉じてゆっくり開く)
    let closeAmount;
    if (blinkPhase < 0.4) {
      closeAmount = blinkPhase / 0.4;  // 速く閉じる
    } else {
      closeAmount = 1 - (blinkPhase - 0.4) / 0.6;  // ゆっくり開く
    }
    closeAmount = Math.max(0, Math.min(1, closeAmount));

    if (closeAmount > 0.05) {
      // 目の領域 (顔中央、上から28-36%の範囲)
      const eyeTop = 0.26;
      const eyeBot = 0.36;
      const eyeH = eyeBot - eyeTop;
      const lidSrcTop = eyeTop - eyeH * 0.3;  // まぶた元: 目の少し上

      // まぶたを目の上から下ろす
      const coverH = eyeH * closeAmount;
      const srcY = lidSrcTop * ih;
      const srcH = eyeH * 0.3 * ih;
      const dstY = oy + eyeTop * dh;
      const dstH = coverH * dh;

      // 目の左右幅 (顔の中央60%)
      const eyeL = 0.2, eyeR = 0.8;
      ctx.globalAlpha = closeAmount * 0.7;
      ctx.drawImage(homeImg,
        eyeL * iw, srcY, (eyeR - eyeL) * iw, srcH,
        ox + eyeL * dw, dstY, (eyeR - eyeL) * dw, dstH
      );
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
  requestAnimationFrame(render);
}
// デュアル駆動
requestAnimationFrame(render);
setInterval(render, 33);

// ===== ホーム画像セット =====
function setHome(url) {
  const im = new Image();
  im.onload = () => {
    homeImg = im;
    isVideo = false;
    vid.classList.remove('show'); vid.pause();
  };
  im.src = url + '?t=' + Date.now();
}

// ===== 動画再生 =====
function playVideo(url, brief) {
  if (reverseRAF) { cancelAnimationFrame(reverseRAF); reverseRAF = null; }
  isVideo = true;
  ctx.clearRect(0, 0, W, H);
  vid.src = url;
  vid.load();
  console.log('[VIDEO] loading:', url.split('/').pop());
  vid.onloadeddata = function() {
    vid.onloadeddata = null;
    console.log('[VIDEO] loaded, playing');
    vid.onended = function() {
      if (brief) { vid.classList.remove('show'); isVideo = false; return; }
      // ピンポン逆再生
      let last = performance.now();
      function rev(now) {
        vid.currentTime = Math.max(0, vid.currentTime - (now - last) / 1000);
        last = now;
        if (vid.currentTime <= 0.1) {
          // ループ: もう一度順再生
          vid.currentTime = 0;
          vid.play().catch(() => {});
          return;
        }
        reverseRAF = requestAnimationFrame(rev);
      }
      vid.pause(); reverseRAF = requestAnimationFrame(rev);
    };
    vid.classList.add('show');
    vid.play().catch(e => console.error('[VIDEO] play failed:', e));
  };
  vid.onerror = (e) => {
    console.error('[VIDEO] error:', vid.error?.message || e);
    isVideo = false;
  };
}

// ===== WebSocket =====
function connect() {
  ws = new WebSocket(WS);
  ws.onopen = () => console.log('LivingPortrait v11');
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'clip_batch' && m.items?.length > 0) {
        const home = m.items[0];
        if (home.type === 'video' && home.url) playVideo(home.url, false);
        else if (home.url) setHome(home.url);
      }
      if (m.type === 'cutaway' && m.url) {
        console.log('[CUTAWAY] showing:', m.url.split('/').pop());
        const wasVideo = isVideo;
        const savedImg = homeImg;
        const savedVidSrc = vid.src;
        const im = new Image();
        im.onload = () => {
          homeImg = im; isVideo = false;
          vid.classList.remove('show'); vid.pause();
          if (reverseRAF) { cancelAnimationFrame(reverseRAF); reverseRAF = null; }
          // 6秒後にホームに復帰
          setTimeout(() => {
            console.log('[CUTAWAY] restoring home');
            if (wasVideo && savedVidSrc) {
              // 動画を再開
              playVideo(savedVidSrc, false);
            } else if (savedImg) {
              homeImg = savedImg;
            }
          }, 6000);
        };
        im.src = m.url + '?t=' + Date.now();
      }
      if (m.type === 'subtitle') {
        speaking = true;
        clearTimeout(speakTimer);
        speakTimer = setTimeout(() => { speaking = false; }, 3000);
      }
    } catch(err) {}
  };
}
connect();
</script>
</body>
</html>
