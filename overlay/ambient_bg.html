<!-- overlay/ambient_bg.html - 感情連動アンビエント背景 v2 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#0a0a12}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const WS_URL='ws://127.0.0.1:8765';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const EMOTION_HUE = {
  joy:45, sadness:220, anger:0, surprise:320,
  affection:25, fear:270, tension:350, loneliness:240, fatigue:0
};
let emo = {joy:40,sadness:0,anger:0,surprise:0,embarrass:0,fear:0,affection:50,fatigue:0,tension:40,loneliness:0};
let targetEmo = {...emo};
let particles = [];
let glowOrbs = [];
let ripples = [];
let ws = null;
let frame = 0;

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

// --- 支配的な感情TOP3を取得 ---
function getTop3(e) {
  return Object.entries(e)
    .filter(([k,v])=>v>10 && EMOTION_HUE[k]!==undefined)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3);
}

// --- 大きなグロー球を管理 ---
function updateGlowOrbs() {
  const W=canvas.width, H=canvas.height;
  const top = getTop3(emo);
  // TOP感情ごとに1つのグロー球
  while(glowOrbs.length < Math.min(top.length, 3)) {
    glowOrbs.push({x:W*0.3+Math.random()*W*0.4, y:H*0.3+Math.random()*H*0.4,
      tx:0, ty:0, hue:0, intensity:0, radius:W*0.25+Math.random()*W*0.15});
  }
  for(let i=0; i<glowOrbs.length; i++) {
    const orb = glowOrbs[i];
    if (i < top.length) {
      const [name, val] = top[i];
      orb.hue = EMOTION_HUE[name];
      orb.intensity = val / 100;
      // ゆっくり漂う目標位置
      if(frame%120===0) {
        orb.tx = W*0.15 + Math.random()*W*0.7;
        orb.ty = H*0.15 + Math.random()*H*0.7;
      }
    } else {
      orb.intensity *= 0.98;
    }
    orb.x += (orb.tx - orb.x) * 0.005;
    orb.y += (orb.ty - orb.y) * 0.005;
  }
}

// --- パーティクル生成（大きく・多く）---
function spawnParticles() {
  const W=canvas.width, H=canvas.height;
  if(emo.joy > 20) {
    const n = Math.ceil(emo.joy / 15);
    for(let i=0;i<n;i++) particles.push({
      x:Math.random()*W, y:H*0.5+Math.random()*H*0.5,
      vx:(Math.random()-0.5)*0.8, vy:-0.3-Math.random()*0.8,
      hue:40+Math.random()*15, sat:80, lit:60,
      size:3+Math.random()*5, alpha:0.7, life:300+Math.random()*200, max:500
    });
  }
  if(emo.loneliness > 15) {
    if(Math.random()<0.5) particles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*0.2, vy:(Math.random()-0.5)*0.15,
      hue:225+Math.random()*20, sat:50, lit:45,
      size:2+Math.random()*4, alpha:0.5, life:500, max:500
    });
  }
  if(emo.tension > 30) {
    if(Math.random()<0.4) particles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*2.5, vy:(Math.random()-0.5)*2,
      hue:350+Math.random()*15, sat:75, lit:50,
      size:2+Math.random()*3, alpha:0.6, life:150+Math.random()*100, max:250
    });
  }
  if(emo.affection > 25 && Math.random()<0.3) {
    particles.push({
      x:Math.random()*W, y:H*0.2+Math.random()*H*0.6,
      vx:(Math.random()-0.5)*0.3, vy:-0.1-Math.random()*0.3,
      hue:20+Math.random()*15, sat:80, lit:55,
      size:4+Math.random()*6, alpha:0.5, life:400, max:400
    });
  }
  if(emo.fatigue > 40 && Math.random()<0.2) {
    particles.push({
      x:Math.random()*W, y:Math.random()*H*0.2,
      vx:(Math.random()-0.5)*0.1, vy:0.15+Math.random()*0.2,
      hue:0, sat:0, lit:25,
      size:3+Math.random()*4, alpha:0.4, life:600, max:600
    });
  }
  if(emo.surprise > 20 && Math.random()<0.5) {
    const cx=W*0.3+Math.random()*W*0.4, cy=H*0.3+Math.random()*H*0.4;
    for(let i=0;i<3;i++) {
      const angle=Math.random()*Math.PI*2;
      particles.push({
        x:cx, y:cy,
        vx:Math.cos(angle)*2, vy:Math.sin(angle)*2,
        hue:310+Math.random()*20, sat:65, lit:60,
        size:3+Math.random()*3, alpha:0.7, life:180, max:180
      });
    }
  }
  if(particles.length>400) particles.splice(0, particles.length-400);
}

// --- シンボルエフェクト（コメントリアクション）---
let symbols = [];

function drawHeart(cx, cy, size, color, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size/15, size/15);
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.bezierCurveTo(-8, -14, -18, -4, 0, 10);
  ctx.bezierCurveTo(18, -4, 8, -14, 0, -4);
  ctx.fillStyle = color.replace('ALPHA', alpha);
  ctx.fill();
  ctx.restore();
}

function drawStar(cx, cy, size, color, alpha, points) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  const n = points || 5;
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? size : size * 0.4;
    const angle = (i * Math.PI / n) - Math.PI / 2;
    const x = Math.cos(angle) * r, y = Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = color.replace('ALPHA', alpha);
  ctx.fill();
  ctx.restore();
}

function drawSparkle(cx, cy, size, color, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  const arms = 4;
  for (let i = 0; i < arms; i++) {
    const angle = (i * Math.PI * 2 / arms);
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
  }
  ctx.strokeStyle = color.replace('ALPHA', alpha);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.stroke();
  // 中心に小さなグロー
  const g = ctx.createRadialGradient(0,0,0, 0,0,size*0.5);
  g.addColorStop(0, color.replace('ALPHA', alpha * 0.6));
  g.addColorStop(1, color.replace('ALPHA', 0));
  ctx.fillStyle = g;
  ctx.fillRect(-size*0.5, -size*0.5, size, size);
  ctx.restore();
}

function drawDiamond(cx, cy, size, color, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(size*0.6, 0);
  ctx.lineTo(0, size);
  ctx.lineTo(-size*0.6, 0);
  ctx.closePath();
  ctx.fillStyle = color.replace('ALPHA', alpha);
  ctx.fill();
  ctx.restore();
}

// スパイク種別→シンボル定義
const SPIKE_SYMBOLS = {
  warmth:     {draw: drawHeart,   color:'hsla(350,80%,65%,ALPHA)', count:8,  sizeMin:10, sizeMax:22, speed:1.5, life:300},
  surprise:   {draw: drawStar,    color:'hsla(45,90%,65%,ALPHA)',  count:10, sizeMin:8,  sizeMax:18, speed:2.5, life:200},
  attention:  {draw: drawSparkle, color:'hsla(50,85%,60%,ALPHA)',  count:6,  sizeMin:12, sizeMax:20, speed:1.0, life:350},
  joy_reflex: {draw: drawStar,    color:'hsla(40,90%,60%,ALPHA)',  count:12, sizeMin:6,  sizeMax:16, speed:2.0, life:250},
  fear_reflex:{draw: drawDiamond, color:'hsla(270,50%,55%,ALPHA)', count:5,  sizeMin:8,  sizeMax:14, speed:1.8, life:250},
  defensiveness:{draw:drawStar,   color:'hsla(0,60%,50%,ALPHA)',   count:4,  sizeMin:6,  sizeMax:12, speed:3.0, life:150},
  default:    {draw: drawSparkle, color:'hsla(200,50%,60%,ALPHA)', count:6,  sizeMin:8,  sizeMax:16, speed:1.2, life:280},
};

function spawnSymbols(type, amount) {
  const W=canvas.width, H=canvas.height;
  const def = SPIKE_SYMBOLS[type] || SPIKE_SYMBOLS.default;
  const intensity = Math.min(1.5, amount / 40);
  const count = Math.ceil(def.count * intensity);
  const cx = W * 0.35 + Math.random() * W * 0.3;
  const cy = H * 0.25 + Math.random() * H * 0.3;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.5;
    const spd = def.speed * (0.6 + Math.random() * 0.8);
    symbols.push({
      x: cx + (Math.random()-0.5) * 60,
      y: cy + (Math.random()-0.5) * 40,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1.0,
      size: def.sizeMin + Math.random() * (def.sizeMax - def.sizeMin),
      draw: def.draw,
      color: def.color,
      alpha: 0.9,
      life: def.life + Math.random() * 100,
      max: def.life + 100,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.04,
    });
  }
}

// --- さざ波（コメント時）---
function addRipple(type, amount) {
  const W=canvas.width, H=canvas.height;
  const hues={warmth:25,surprise:320,attention:50,joy_reflex:45,default:200};
  const hue=hues[type]||hues.default;
  const intensity=Math.min(1, amount/50);
  for(let i=0;i<2;i++) ripples.push({
    x:W*0.2+Math.random()*W*0.6, y:H*0.2+Math.random()*H*0.6,
    r:0, maxR:200+intensity*300, hue, alpha:0.5+intensity*0.3, speed:3+intensity*4
  });
}

function lerp(a,b,t){return a+(b-a)*t}

// --- メイン描画 ---
function render() {
  const W=canvas.width, H=canvas.height;
  frame++;

  // 感情を緩やかに追従
  for(const k of Object.keys(emo)) {
    if(targetEmo[k]!==undefined) emo[k]=lerp(emo[k], targetEmo[k], 0.03);
  }

  // 背景: 支配感情で色味が変わる暗い背景
  const top = getTop3(emo);
  let bgHue=240, bgSat=8, bgLit=5;
  if(top.length>0) {
    const [name,val]=top[0];
    bgHue=EMOTION_HUE[name]; bgSat=10+val*0.3; bgLit=4+val*0.06;
  }
  // fatigueで彩度を落とす
  bgSat = bgSat * (1 - emo.fatigue/200);
  ctx.fillStyle=`hsl(${bgHue},${bgSat}%,${bgLit}%)`;
  ctx.fillRect(0,0,W,H);

  // 大きなグロー球を描画（感情の「オーラ」）
  updateGlowOrbs();
  for(const orb of glowOrbs) {
    if(orb.intensity<0.02) continue;
    const pulse = 1 + Math.sin(frame*0.015)*0.15;
    const r = orb.radius * pulse;
    const grad=ctx.createRadialGradient(orb.x,orb.y,0, orb.x,orb.y, r);
    const a = orb.intensity * 0.35;
    grad.addColorStop(0, `hsla(${orb.hue},60%,40%,${a})`);
    grad.addColorStop(0.4, `hsla(${orb.hue},50%,30%,${a*0.5})`);
    grad.addColorStop(1, `hsla(${orb.hue},40%,20%,0)`);
    ctx.fillStyle=grad;
    ctx.fillRect(orb.x-r, orb.y-r, r*2, r*2);
  }

  // パーティクル生成・描画
  spawnParticles();
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx+Math.sin(frame*0.01+i)*0.3;
    p.y+=p.vy;
    p.life--;
    const fade=p.life/p.max;
    if(p.life<=0){particles.splice(i,1);continue}
    const a=p.alpha*fade;
    const s=p.size*(0.4+fade*0.6);
    // パーティクルにグロー効果
    const glow=ctx.createRadialGradient(p.x,p.y,0, p.x,p.y, s*3);
    glow.addColorStop(0, `hsla(${p.hue},${p.sat}%,${p.lit}%,${a})`);
    glow.addColorStop(0.5, `hsla(${p.hue},${p.sat}%,${p.lit}%,${a*0.3})`);
    glow.addColorStop(1, `hsla(${p.hue},${p.sat}%,${p.lit}%,0)`);
    ctx.fillStyle=glow;
    ctx.fillRect(p.x-s*3, p.y-s*3, s*6, s*6);
    // 中心の明るい点
    ctx.beginPath();
    ctx.arc(p.x,p.y,s*0.6,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},${p.sat}%,${Math.min(90,p.lit+20)}%,${a})`;
    ctx.fill();
  }

  // さざ波
  for(let i=ripples.length-1;i>=0;i--) {
    const r=ripples[i];
    r.r+=r.speed;
    const prog=r.r/r.maxR;
    if(prog>=1){ripples.splice(i,1);continue}
    const a=r.alpha*(1-prog);
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${r.hue},70%,60%,${a})`;
    ctx.lineWidth=3*(1-prog);
    ctx.stroke();
    // 内側にもう1つ薄いリング
    if(r.r>30) {
      ctx.beginPath();
      ctx.arc(r.x,r.y,r.r*0.6,0,Math.PI*2);
      ctx.strokeStyle=`hsla(${r.hue},60%,50%,${a*0.4})`;
      ctx.lineWidth=2*(1-prog);
      ctx.stroke();
    }
  }

  // シンボルエフェクト描画
  for(let i=symbols.length-1;i>=0;i--) {
    const s=symbols[i];
    s.x+=s.vx; s.y+=s.vy;
    s.vy+=0.01; // 軽い重力
    s.rot+=s.rotSpeed;
    s.life--;
    if(s.life<=0){symbols.splice(i,1);continue}
    const fade=Math.min(1, s.life/60) * Math.min(1, (s.max-s.life)/30); // fade in + out
    const a=s.alpha*fade;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.translate(-s.x, -s.y);
    // グロー
    const glow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.size*2);
    glow.addColorStop(0,s.color.replace('ALPHA',a*0.3));
    glow.addColorStop(1,s.color.replace('ALPHA',0));
    ctx.fillStyle=glow;
    ctx.fillRect(s.x-s.size*2,s.y-s.size*2,s.size*4,s.size*4);
    // シンボル本体
    s.draw(s.x, s.y, s.size*fade, s.color, a);
    ctx.restore();
  }
  if(symbols.length>100) symbols.splice(0,symbols.length-100);

  requestAnimationFrame(render);
}

// --- WebSocket ---
function connect() {
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>console.log('WS connected');
  ws.onclose=()=>{console.log('WS closed');setTimeout(connect,2000)};
  ws.onerror=()=>{};
  ws.onmessage=(e)=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type==='state_update') {
        targetEmo=msg.emotions||targetEmo;
      }
      else if(msg.type==='comment_event') {
        addRipple(msg.spike_type||'default', msg.spike_amount||30);
        spawnSymbols(msg.spike_type||'default', msg.spike_amount||30);
        // コメント時にバースト粒子も
        const W=canvas.width,H=canvas.height;
        const hues={warmth:25,surprise:320,attention:50,default:200};
        const hue=hues[msg.spike_type]||hues.default;
        for(let i=0;i<12;i++){
          const angle=Math.random()*Math.PI*2;
          const speed=1+Math.random()*2;
          particles.push({
            x:W*0.3+Math.random()*W*0.4, y:H*0.3+Math.random()*H*0.4,
            vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
            hue, sat:70, lit:60,
            size:3+Math.random()*4, alpha:0.8, life:200, max:200
          });
        }
      }
    }catch(err){}
  };
}
connect();
render();
</script>
</body>
</html>
